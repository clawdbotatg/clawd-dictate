# xcodegen spec — `xcodegen generate` in this dir → ClawdDictate.xcodeproj
#
# Two targets, the Wispr Flow shape (iOS keyboard extensions can't touch the
# microphone — Apple's rule since iOS 8):
#   ClawdDictate  — the app. Holds the mic in the BACKGROUND (audio mode),
#                   streams 16 kHz PCM to Deepgram nova-3 with the shared
#                   keyterms, applies the replace rules, hands text to the
#                   keyboard through the App Group.
#   ClawdKeys     — the keyboard. One mic key + live text; tap → asks the app
#                   (Darwin notification) or launches it (clawddictate://start)
#                   the first time; inserts what the app transcribes.
name: ClawdDictate
options:
  bundleIdPrefix: com.clawd.dictate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: XX7QP5899Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClawdDictate:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: clawd dictate
        CFBundleName: ClawdDictate
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: clawd dictate listens while you dictate from the clawd keyboard and sends the audio to Deepgram for transcription.
        CFBundleURLTypes:
          - CFBundleURLName: com.clawd.dictate
            CFBundleURLSchemes: [clawddictate]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.clawd.dictate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clawd.dictate.ios
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ClawdKeys
        embed: true
  ClawdKeys:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: clawd keys
        CFBundleName: ClawdKeys
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.clawd.dictate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clawd.dictate.ios.keyboard
        SKIP_INSTALL: true
